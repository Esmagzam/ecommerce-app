name: ecommerce_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  cached_network_image: ^4.0.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.3
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/store.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/rb.png
  color_dark: "#0F172A"
  image_dark: assets/images/rb.png
  android_12:
    image: assets/images/rb.png
    color: "#ffffff"
    color_dark: "#0F172A"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
